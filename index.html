<!doctype html>
<html lang="ko" data-seed data-seed-color-mode="system">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#c8362a" />
    <!-- 화면 확대·축소를 막는다. 두 손가락으로 페이지를 키우면 고정된 시트·버튼이 화면 밖으로 밀려
         레이아웃이 깨진 채로 남았다. 지도 확대는 카카오 SDK 가 직접 처리하므로 영향이 없다.
         maximum-scale=1 은 아이폰이 16px 보다 작은 입력칸을 누를 때 저절로 확대하는 것도 막는다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="네이버 즐겨찾기에 저장한 맛집을 지도에서 찾아봅니다." />
    <title>맛핀</title>
    <!-- 카톡·메신저에 링크를 붙였을 때 뜨는 미리보기. 이미지는 절대 주소여야 한다. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="맛핀" />
    <meta property="og:description" content="저장한 맛집을 지도 한 장에. 세 지도의 평점을 한 번에 비교합니다." />
    <meta property="og:image" content="https://matpin.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 본문 글꼴. dynamic-subset 은 화면에 실제로 쓰인 글자가 든 청크만 받아오므로
         첫 화면 비용이 수십 KB 다. 로컬에 Pretendard 가 깔린 기기는 이 요청조차 안 한다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />

    <script>
      // SEED 는 system 모드에서 data-seed-user-color-scheme 을 읽는다. 첫 페인트 전에 정해야
      // 화면이 번쩍이지 않는다. 사용자가 고른 값이 있으면 그게 우선.
      (function () {
        try {
          var saved = localStorage.getItem('matpin-color-scheme');
          var scheme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-seed-user-color-scheme', scheme);
        } catch (e) {
          document.documentElement.setAttribute('data-seed-user-color-scheme', 'light');
        }
      })();

      // 아이폰 사파리는 user-scalable=no 를 무시한다(접근성 정책). 사파리 전용 제스처 이벤트를
      // 막아야 페이지 핀치 확대가 멈춘다. 지도 핀치는 터치 이벤트로 따로 처리돼 그대로 된다.
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });

      // 설치 신호(beforeinstallprompt)는 앱 번들보다 먼저 올 수 있다. 여기서 붙잡아 두면
      // src/lib/install.ts 가 뜰 때 이어받아 앱 안 「설치」 버튼으로 쓴다.
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__matpinInstall = e; });
    </script>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=489abbeb60a4ef5ff58d960dcaeecb4e&libraries=services"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
