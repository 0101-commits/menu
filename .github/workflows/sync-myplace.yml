name: 즐겨찾기 동기화

# 주 1회 자동 수집 + 수동 실행. NAVER_COOKIE는 계정/IP에 따라 무효화될 수 있다.
# 실패하면 실제 실패 단계를 한 이슈에 누적하고, 다음 성공에서 자동으로 닫는다.
on:
  schedule:
    - cron: '0 20 * * 0' # 매주 월요일 05:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-myplace
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 즐겨찾기 수집
        id: fetch
        env:
          NAVER_COOKIE: ${{ secrets.NAVER_COOKIE }}
        shell: bash
        run: |
          set +e
          node scripts/fetch-myplace.mjs 2>&1 | tee fetch.log
          code=${PIPESTATUS[0]}
          if grep -q 'LOGIN_REQUIRED' fetch.log; then echo 'reason=NAVER_COOKIE 만료 또는 Actions IP 무효' >> "$GITHUB_OUTPUT";
          elif grep -q 'NAVER_COOKIE 가 없습니다' fetch.log; then echo 'reason=NAVER_COOKIE secret 누락' >> "$GITHUB_OUTPUT";
          elif [ "$code" -ne 0 ]; then echo 'reason=네이버 API 수집 오류' >> "$GITHUB_OUTPUT";
          fi
          exit "$code"

      - name: 신규 장소 보강
        id: enrich
        run: node scripts/enrich.mjs --only-new

      - name: 외부 장소 ID 매칭
        id: match
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
        run: node scripts/match.mjs

      - name: places.json 생성 + 게이트
        id: places
        run: node scripts/build-places.mjs

      - name: 평점 수집 (주간 1/4)
        id: ratings
        run: |
          node scripts/restore-ratings.mjs
          node scripts/ratings.mjs --force --shard=$(( ($(date +%V) % 4) + 1 ))/4

      - name: ratings.json 생성 + 게이트
        id: ratings_build
        run: node scripts/build-ratings.mjs

      - name: 데이터 메타데이터 생성
        id: meta
        run: npm run build:meta

      - name: 전체 검사
        id: verify
        run: |
          npm run test
          npm run typecheck
          npm run build

      - name: 리포트 읽기
        id: report
        run: |
          FILE=$(ls -t reports/diff-*.md | head -1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<PR_BODY_EOF'
            cat "$FILE"
            echo 'PR_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: PR 생성
        id: pull_request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          branch: sync/myplace
          title: '즐겨찾기 동기화 ${{ github.run_number }}'
          body: ${{ steps.report.outputs.body }}
          commit-message: 'chore(data): 네이버 즐겨찾기 동기화'
          add-paths: |
            public/data/places.json
            public/data/ratings.json
            public/data/meta.json
            public/data/details.json
          delete-branch: true

      - name: 실패 알림 이슈
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          FETCH_REASON: ${{ steps.fetch.outputs.reason }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          ENRICH_OUTCOME: ${{ steps.enrich.outcome }}
          MATCH_OUTCOME: ${{ steps.match.outcome }}
          PLACES_OUTCOME: ${{ steps.places.outcome }}
          RATINGS_OUTCOME: ${{ steps.ratings.outcome }}
          RATINGS_BUILD_OUTCOME: ${{ steps.ratings_build.outcome }}
          META_OUTCOME: ${{ steps.meta.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const outcomes = [
              ['즐겨찾기 수집', process.env.FETCH_OUTCOME, process.env.FETCH_REASON],
              ['신규 장소 보강', process.env.ENRICH_OUTCOME, '보강 스크립트·입력 경로 또는 네트워크 오류'],
              ['외부 장소 ID 매칭', process.env.MATCH_OUTCOME, '카카오·구글 매칭 오류'],
              ['places 게이트', process.env.PLACES_OUTCOME, '장소 데이터 축소·중복·정규화 게이트 실패'],
              ['평점 수집', process.env.RATINGS_OUTCOME, '평점 소스 조회 오류'],
              ['ratings 게이트', process.env.RATINGS_BUILD_OUTCOME, '평점 데이터 축소·파싱 게이트 실패'],
              ['메타데이터', process.env.META_OUTCOME, 'meta.json 생성 게이트 실패'],
              ['검증', process.env.VERIFY_OUTCOME, '테스트·타입·빌드 실패'],
            ];
            const failed = outcomes.find(([, outcome]) => outcome === 'failure');
            const stage = failed?.[0] ?? '알 수 없는 단계';
            const reason = failed?.[2] || 'Actions 로그를 확인하세요.';
            const title = '즐겨찾기 동기화 실패';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'sync-failure', per_page: 10,
            });
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [`실행 ${context.runId} 실패`, '', `- 실패 단계: **${stage}**`, `- 진단: ${reason}`, `- 로그: ${url}`].join('\n');
            if (open.length) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['sync-failure'] });
            }

      - name: 성공 시 실패 이슈 종료
        if: success()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'sync-failure', per_page: 10,
            });
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: `동기화가 정상 완료되어 자동으로 닫습니다.\n\n${url}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                state: 'closed', state_reason: 'completed',
              });
            }
