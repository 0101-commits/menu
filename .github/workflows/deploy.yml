name: 배포

# main 에 올라가면 두 곳으로 내보낸다.
#   새 주소 https://matpin.pages.dev/   — Cloudflare Pages (도메인 맨 앞, VITE_BASE=/)
#   옛 주소 https://0101-commits.github.io/menu/ — GitHub Pages (VITE_BASE=/menu/). 새 주소로 넘길 때까지 같은 앱을 둔다.
# 데이터(public/data/*.json)는 레포에 커밋돼 있으므로 여기서 수집하지 않는다.
# 수집은 sync-myplace.yml 이 주 1회 돌려 PR 로 올린다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살린다. 진행 중인 것을 죽이지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - run: npm ci

      - name: 전체 테스트
        run: npm run test

      - name: 타입 검사
        run: npm run typecheck

      - name: 빌드
        run: npm run build
        env:
          VITE_BASE: /menu/
          # Worker 를 띄웠다면 레포 Variables 에 넣는다. 없으면 온디맨드 평점만 꺼진다.
          VITE_RATINGS_API: ${{ vars.VITE_RATINGS_API }}
          VITE_GOOGLE_RATINGS: ${{ vars.VITE_GOOGLE_RATINGS }}

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # 새 주소. 레포 Secrets 에 CLOUDFLARE_API_TOKEN(Cloudflare Pages 편집 권한)과 CLOUDFLARE_ACCOUNT_ID 가 있어야 올라간다.
  # 토큰이 없으면 경고만 남기고 넘어간다 — 그동안은 로컬에서 `npx wrangler pages deploy dist --project-name matpin` 로 올린다.
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN 이 없어 matpin.pages.dev 는 이번 배포에서 갱신되지 않았습니다."

      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - if: env.HAS_TOKEN == 'true'
        run: npm ci

      - name: 빌드(도메인 맨 앞)
        if: env.HAS_TOKEN == 'true'
        run: npm run build
        env:
          VITE_BASE: /
          VITE_RATINGS_API: ${{ vars.VITE_RATINGS_API }}
          VITE_GOOGLE_RATINGS: ${{ vars.VITE_GOOGLE_RATINGS }}

      - name: Cloudflare Pages 로 올리기
        if: env.HAS_TOKEN == 'true'
        run: npx --yes wrangler@4.153.0 pages deploy dist --project-name matpin --branch main --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
