name: 구글 평점 게이트·시드

# 구글 키는 레포 시크릿에만 있다. 로컬에서는 값을 읽을 수 없으므로 여기서 돌린다.
# CF 자격증명은 필요 없다 — 이 워크플로는 **파일만 만들고**, KV 업로드는 로컬에서
# wrangler(OAuth 로그인돼 있음)로 한다.
#
#   verify  무작위 50곳의 googlePlaceId 가 실제로 그 가게인지 대조한다. **시드 전의 게이트다.**
#           오류율 5% 초과면 실패로 끝난다. 평점 필드를 요청하지 않아 평점 SKU 를 쓰지 않는다.
#   seed    전량(구글 ID 보유 3,613곳)을 받아 raw/google-kv.json 을 만든다.
#           유료 구간이라 confirm_paid 를 켜야 한다(무료 크레딧으로 덮는 것도 여기서 확인한다).
#
# 산출물은 아티팩트로 받는다:
#   gh run download <run-id> -n google-seed -D raw
#   cd worker && npx wrangler kv bulk put ../raw/google-kv.json --binding RATINGS --remote

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '무엇을 할지'
        type: choice
        options: [verify, seed]
        default: verify
        required: true
      n:
        description: 'verify — 표본 수'
        default: '50'
        required: false
      limit:
        description: 'seed — 받을 건수. all 이면 전량'
        default: 'all'
        required: false
      confirm_paid:
        description: 'seed — 무료 한도(월 1,000)를 넘는 건수를 받겠다고 확인한다'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: google-seed
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 키 확인
        env:
          GOOGLE_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
        run: |
          if [ -z "$GOOGLE_KEY" ]; then
            echo 'GOOGLE_PLACES_KEY 시크릿이 없습니다.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 매칭 표본 검증 (게이트)
        if: inputs.mode == 'verify'
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          N: ${{ inputs.n }}
        run: |
          [[ "$N" =~ ^[0-9]+$ ]] || { echo 'n 은 숫자만'; exit 1; }
          node scripts/google-verify-match.mjs --n="$N"

      # 게이트가 막아도 결과는 봐야 한다. 무엇이 어긋났는지가 다음 수를 정한다.
      - name: 검증 결과 요약
        if: always() && inputs.mode == 'verify'
        run: |
          if [ -f reports/google-match-sample.md ]; then
            cat reports/google-match-sample.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 전량 시드
        if: inputs.mode == 'seed'
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          LIMIT: ${{ inputs.limit }}
        run: |
          [[ "$LIMIT" == all || "$LIMIT" =~ ^[0-9]+$ ]] || { echo 'limit 는 all 또는 숫자'; exit 1; }
          if [ "$LIMIT" = "all" ]; then
            node scripts/google-fill.mjs --all ${{ inputs.confirm_paid && '--yes' || '' }}
          else
            node scripts/google-fill.mjs --limit="$LIMIT" ${{ inputs.confirm_paid && '--yes' || '' }}
          fi

      # 받은 값은 공개 레포에 커밋하지 않는다(약관). 아티팩트로만 내보내고 KV 로 간다.
      # 기본 보관 기간(90일)보다 짧게 둔다 — 로컬로 내려받는 즉시 쓸모가 끝난다.
      - name: 산출물 업로드
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: google-seed
          path: |
            raw/google-kv.json
            raw/google.json
            reports/google-match-sample.md
          if-no-files-found: warn
          retention-days: 3

      - name: 요약
        if: always()
        env:
          MODE: ${{ inputs.mode }}
        run: |
          echo "## 구글 $MODE" >> "$GITHUB_STEP_SUMMARY"
          if [ -f raw/google.json ]; then
            node -e "const l=require('./raw/google.json');const v=Object.values(l);console.log('- 원장 '+v.length+'건 (없어진 곳 '+v.filter(x=>x.gone).length+'건)')" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '내려받기: `gh run download ${{ github.run_id }} -n google-seed -D .`' >> "$GITHUB_STEP_SUMMARY"
