# 온디맨드 평점 Worker.
#
# 배포 (이 폴더에서 실행한다 — cd worker)
#   0) 로그인          npx wrangler login
#   1) KV 만들기        npx wrangler kv namespace create RATINGS
#      출력된 id 를 아래 kv_namespaces 의 id 에 넣는다.
#   2) 구글 키(선택)    npx wrangler secret put GOOGLE_PLACES_KEY
#      넣지 않으면 구글 칸만 꺼지고 네이버·카카오는 그대로 된다.
#   3) 배포             npx wrangler deploy
#   4) 앱에 연결        레포 Settings > Secrets and variables > Actions > Variables 에
#                       VITE_RATINGS_API = https://<배포주소>/
#                       구글까지 쓰면 VITE_GOOGLE_RATINGS = 1
#
# 무료 요금제로 충분하다(하루 100,000 요청, KV 읽기 100,000/일).

name = "matpin-ratings"
main = "index.js"
compatibility_date = "2026-09-01"

[vars]
# 이 주소에서 온 요청만 받는다. 비워 두면 전부 403 이다(열리지 않는다).
ALLOWED_ORIGINS = "https://0101-commits.github.io,http://localhost:5173"

# 하루 상한. 구글만 돈이 든다 — 30 × 30일 = 900 으로 무료 한도(월 1,000) 안에 둔다.
# 다만 KV 카운터는 동시 요청에서 정확하지 않다. 요금의 진짜 상한은
# Google Cloud 콘솔 > API 및 서비스 > 할당량에서 Place Details 일일 한도로 걸어야 한다.
DAILY_GOOGLE_LIMIT = "30"
DAILY_NAVER_LIMIT = "500"
DAILY_KAKAO_LIMIT = "500"

[[kv_namespaces]]
binding = "RATINGS"
id = "d4619543152c40e8b9107f85abc83712"
